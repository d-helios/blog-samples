kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4
    extraPortMappings:
      # Istio ingress gateway. *.localtest.me resolves to 127.0.0.1.
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1

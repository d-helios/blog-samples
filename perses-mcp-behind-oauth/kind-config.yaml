kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mcp-demo
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      # Istio ingress gateway. *.localhost resolves to 127.0.0.1.
      # :80 only redirects to :443; TLS terminates on the gateway with the
      # cert-manager certificate from the lab CA.
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1

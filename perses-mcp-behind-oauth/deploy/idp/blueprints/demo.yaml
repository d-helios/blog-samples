# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: perses-mcp-behind-oauth demo
entries:
  - model: authentik_core.group
    id: group
    identifiers:
      name: Observability MCP

  - model: authentik_core.user
    id: alice
    identifiers:
      username: alice
    attrs:
      name: Alice (SRE)
      email: alice@example.com
      password: !Env DEMO_USER_PASSWORD
      groups: [!KeyOf group]
  - model: authentik_core.user
    id: bob
    identifiers:
      username: bob
    attrs:
      name: Bob (outsider)
      email: bob@example.com
      password: !Env DEMO_USER_PASSWORD
      groups: []

  # App passwords let the e2e test get user tokens without a browser.
  - model: authentik_core.token
    identifiers:
      identifier: alice-e2e
    attrs:
      intent: app_password
      expiring: false
      user: !KeyOf alice
      key: !Env ALICE_APP_PASSWORD
  - model: authentik_core.token
    identifiers:
      identifier: bob-e2e
    attrs:
      intent: app_password
      expiring: false
      user: !KeyOf bob
      key: !Env BOB_APP_PASSWORD

  # Perses UI login: confidential client, authorization code + PKCE.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-perses
    identifiers:
      name: perses
    attrs:
      client_type: confidential
      client_id: perses
      client_secret: !Env PERSES_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      redirect_uris:
        - matching_mode: strict
          url: https://perses.localhost/api/auth/providers/oidc/authentik/callback
          redirect_uri_type: authorization
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      property_mappings: &mappings
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  - model: authentik_core.application
    id: app-perses
    identifiers:
      slug: perses
    attrs:
      name: Perses
      provider: !KeyOf provider-perses
      meta_launch_url: https://perses.localhost/

  # MCP clients (Claude Code): public client, authorization code + PKCE, any
  # localhost port. client_credentials (username + app password) is only for
  # the e2e test. The audience of the token is the client id, "perses-mcp".
  # No group binding here on purpose: Authentik issues tokens to bob too, and
  # the gateway refuses them, which is the point of the demo.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-mcp
    identifiers:
      name: perses-mcp
    attrs:
      client_type: public
      client_id: perses-mcp
      grant_types: [authorization_code, refresh_token, client_credentials]
      redirect_uris:
        - matching_mode: regex
          url: ^https?://(localhost|127\.0\.0\.1):[0-9]+/callback$
          redirect_uri_type: authorization
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      access_token_validity: minutes=30
      refresh_token_validity: hours=8
      property_mappings: *mappings
  - model: authentik_core.application
    id: app-mcp
    identifiers:
      slug: perses-mcp
    attrs:
      name: Perses MCP
      provider: !KeyOf provider-mcp

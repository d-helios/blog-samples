# Picked up by the Perses sidecar (label perses.dev/resource).
apiVersion: v1
kind: ConfigMap
metadata:
  name: perses-datasources
  labels:
    perses.dev/resource: "true"
data:
  victoriametrics.yaml: |
    kind: GlobalDatasource
    metadata:
      name: victoriametrics
    spec:
      default: true
      plugin:
        kind: PrometheusDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://vmsingle-vm:8428
  victorialogs.yaml: |
    kind: GlobalDatasource
    metadata:
      name: victorialogs
    spec:
      default: false
      plugin:
        kind: VictoriaLogsDatasource
        spec:
          proxy:
            kind: HTTPProxy
            spec:
              url: http://vlsingle-logs:9428
